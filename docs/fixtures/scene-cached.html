<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>scene preloaded backdrop test</title>
<script>
  // The backdrop is preloaded, so the scene's image is in flight or complete (maybe not decoded) when it upgrades.
  window.backdropUrl = new URLSearchParams(location.search).get("src") || "../img/lake.webp";
  const link = Object.assign(document.createElement("link"), { rel: "preload", as: "image", href: window.backdropUrl, crossOrigin: "anonymous" });
  document.head.append(link);
</script>
<style>
  html,body{margin:0}
  glass-scene{width:390px;height:420px;overflow:hidden}
</style>
</head>
<body>
<script type="module">
  import "glassy-liquid/elements";
  const url = window.backdropUrl;
  const late = new URLSearchParams(location.search).get("late");
  const scene = () => {
    const s = document.createElement("glass-scene");
    s.setAttribute("src", url);
    s.style.position = "relative";
    s.innerHTML = `<glass-surface radius="85" material="clear" style="position:absolute;left:110px;top:120px;width:170px;height:170px"></glass-surface>`;
    document.body.append(s);
  };
  if (late !== null) {
    // The scene appears only once the image is in the cache: its <img> is complete at once.
    const img = new Image();
    img.crossOrigin = "anonymous";
    img.onload = () => setTimeout(scene, +late);
    img.src = url;
  } else {
    scene();
  }
</script>
</body>
</html>
