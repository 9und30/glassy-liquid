<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>components test</title>
<style>
  html,body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Inter",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
  .phone{position:relative;width:390px;height:844px;overflow:hidden;background:#000 url(../img/fruit.webp) center/cover;}
  .stack{position:absolute;left:16px;right:16px;display:flex;gap:12px;align-items:center}
  glass-tab svg{width:26px;height:26px}
  glass-button svg{width:20px;height:20px}
</style>
</head>
<body>
<div class="phone" id="phone">
  <div class="stack" style="top:56px;justify-content:space-between">
    <glass-button shape="circle" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></glass-button>
    <glass-button>Edit</glass-button>
    <glass-button variant="prominent">Done</glass-button>
  </div>
  <glass-surface radius="34" style="position:absolute;left:16px;right:16px;top:130px;padding:18px 20px;display:flex;flex-direction:column;gap:18px">
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:500">Airplane Mode <glass-switch></glass-switch></div>
    <div style="display:flex;justify-content:space-between;align-items:center;font-size:17px;font-weight:500">Wi-Fi <glass-switch checked></glass-switch></div>
    <glass-slider value="62" aria-label="Brightness"></glass-slider>
    <glass-slider value="50" step="25" ticks aria-label="Speed"></glass-slider>
  </glass-surface>
  <div class="stack" style="top:420px;justify-content:center">
    <glass-segmented value="week">
      <glass-segment value="day">Day</glass-segment>
      <glass-segment value="week">Week</glass-segment>
      <glass-segment value="month">Month</glass-segment>
      <glass-segment value="year">Year</glass-segment>
    </glass-segmented>
  </div>
  <glass-tab-bar value="home" style="position:absolute;left:16px;right:16px;bottom:30px" aria-label="Main">
    <glass-tab value="home"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l9 8h-3v9h-4v-6h-4v6H6v-9H3z"/></svg>Home</glass-tab>
    <glass-tab value="library"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="15" rx="3"/><path d="M3 10h18"/></svg>Library</glass-tab>
    <glass-tab value="recent"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 3"/></svg>Recent</glass-tab>
    <glass-tab value="profile"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="8" r="4"/><path d="M4 21c1-4 4-6 8-6s7 2 8 6"/></svg>Profile</glass-tab>
  </glass-tab-bar>
</div>
<script type="module">
  import "glassy-liquid/elements";
  import * as glassy from "glassy-liquid";
  window.glassy = glassy;
  const q = new URLSearchParams(location.search);
  if (q.get("appearance")) document.documentElement.style.setProperty("--glass-appearance", q.get("appearance"));
  if (q.get("bg")) document.getElementById("phone").style.backgroundImage = `url(../img/${q.get("bg")}.webp)`;
</script>
</body>
</html>
