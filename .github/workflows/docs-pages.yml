# Deploys the docs site to GitHub Pages (https://9und30.github.io/glassy-liquid/)
# only when someone runs this workflow by hand. It does not run on push, pull
# request, or a schedule. Pages must use "GitHub Actions" as its source.
name: Docs site

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        # .nvmrc pins 22, which resolves to the newest 22.x (devEngines needs 22.18 or newer).
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Build docs for the project subpath
        run: npm run docs:build
        env:
          DOCS_BASE: /glassy-liquid/
          DOCS_ORIGIN: https://9und30.github.io/glassy-liquid

      - name: Check the artifact
        run: |
          set -euo pipefail
          for file in index.html 404.html llms.txt llms-full.txt robots.txt sitemap.xml; do
            test -s "docs-dist/$file" || { echo "docs-dist/$file is missing"; exit 1; }
          done
          grep -q '<base href="/glassy-liquid/"' docs-dist/404.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs-dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
