<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>glass benchmark</title>
    <style>
      html,
      body {
        margin: 0;
        background: #111;
      }
      #scene {
        position: relative;
        width: 1200px;
        height: 760px;
        overflow: hidden;
      }
      #content {
        position: absolute;
        inset: 0;
        overflow: hidden;
        background: #223 url(lake.webp) center / cover;
      }
      #content .text {
        position: absolute;
        left: 0;
        right: 0;
        top: 0;
        padding: 40px;
        color: #fff;
        font:
          600 28px/1.35 system-ui,
          sans-serif;
        text-shadow: 0 1px 3px #0008;
      }
      .s {
        position: absolute;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #111;
        font:
          600 16px system-ui,
          sans-serif;
      }
    </style>
  </head>
  <body>
    <div id="scene">
      <div id="content"><div class="text" id="text"></div></div>
    </div>
    <script type="module" src="./compare.ts"></script>
  </body>
</html>
